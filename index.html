<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمارة المخزن والشقتين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#F1EFEA; --panel:#FFFFFF; --ink:#22252B; --ink-2:#5C6270; --line:#D9D5CC;
    --accent:#1F5FBF; --accent-ink:#FFFFFF; --chip:#E9E5DC;
    --wh:#D9A441; --apt:#6F9BD6; --core:#2A8C8C; --well:#B9C7D6; --s1:#E07A5F; --s2:#F2C14E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1D22; --panel:#24272E; --ink:#ECE9E2; --ink-2:#A6ABB6; --line:#3A3E47;
      --accent:#7FB0F5; --accent-ink:#0F1A2C; --chip:#2F333C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1D22; --panel:#24272E; --ink:#ECE9E2; --ink-2:#A6ABB6; --line:#3A3E47;
    --accent:#7FB0F5; --accent-ink:#0F1A2C; --chip:#2F333C;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal",system-ui,sans-serif;direction:rtl;overflow:hidden}
  #app{display:grid;grid-template-columns:320px 1fr;height:100vh}
  #panel{background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  h1{font-size:20px;font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
  .sub{color:var(--ink-2);font-size:13px;margin:0}
  .steps{display:flex;flex-direction:column;gap:4px}
  .step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:right;width:100%}
  .step:hover{background:var(--chip)}
  .step[aria-current="step"]{border-color:var(--accent);background:var(--chip);font-weight:600}
  .step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
  .note{background:var(--chip);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;min-height:96px}
  .note b{font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1;min-width:88px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{background:var(--chip)}
  .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .facts{font-size:13px;color:var(--ink-2);line-height:1.8;border-top:1px solid var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
  .facts span{color:var(--ink);font-weight:600}
  #stage{position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}
  .hint{position:absolute;bottom:10px;right:14px;font-size:12px;color:var(--ink-2);background:var(--panel);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
  @media (max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    #panel{order:2;max-height:46vh;border-left:0;border-top:1px solid var(--line);padding:12px 14px}
    #stage{order:1}
    .note{min-height:0}
  }
  @media (prefers-reduced-motion: reduce){ .step,.btn{transition:none} }
</style>
</head>
<body>

<div id="app">
  <aside id="panel">
    <div>
      <h1>عمارة المخزن والشقتين</h1>
      <p class="sub">٤ أدوار على ١٠٥ متر. دوس على الخطوات علشان تشوف العمارة بتتبني دور دور.</p>
    </div>

    <div class="steps" id="steps"></div>

    <div class="note" id="note"></div>

    <div class="row">
      <button class="btn" id="play" aria-pressed="false">▶ اتفرج على البناء</button>
      <button class="btn" id="explode" aria-pressed="false">افصل الأدوار</button>
    </div>
    <div class="row">
      <button class="btn" data-view="street12">من شارع الـ ١٢</button>
      <button class="btn" data-view="street6">من شارع الـ ٦</button>
      <button class="btn" data-view="top">من فوق</button>
    </div>

    <div class="facts">
      الأرض الكلية <span>٢٠٩ م²</span> · للبناء <span>١٠٥ م²</span><br>
      المخزن صافي <span>≈ ٩٠ م²</span> في كل دور<br>
      الشقة صافي <span>≈ ٨٨ م²</span> · السلم <span>٣ × ٥</span> · المنور <span>١ × ١.٥</span>
    </div>
  </aside>

  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hint">اسحب علشان تلف · عجلة الماوس أو أصبعين للتقريب</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- plan geometry (meters, plan y goes "up" the paper; world z = -y) ----------
  const LAND  = [[0,0],[3.46,13.67],[-9.58,16.97],[-13.45,0]];
  const STRIP1= [[-13.45,0],[0,0],[1.47,5.82],[-12.12,5.85]];           // 6 m back from the 12 m street
  const STRIP2= [[-1.62,5.83],[1.47,5.82],[3.46,13.67],[0.55,14.41]];    // 3 m back from the 6 m street
  const BLD   = [[-12.12,5.85],[-1.62,5.83],[0.55,14.41],[-9.58,16.97]]; // A, D2, C2, B'
  const MEZZ  = [[-10.99,10.8],[-0.36,10.8],[0.55,14.41],[-9.58,16.97]];
  const MEZZ_HOLE = [[-10.6,10.85],[-9.2,10.85],[-9.2,14.2],[-10.6,14.2]];   // stair opening in the mezzanine
  const COLS  = [[-11.9,6.1],[-8.9,6.1],[-3.7,6.1],[-1.9,6.1],[-10.8,10.8],[-6.9,10.8],[-2.9,10.8],[-9.3,16.7],[-6.8,16.1]];
  const CORE  = [[0.55,14.41],[-0.185,11.50],[-5.03,12.73],[-4.30,15.64]];   // 3 x 5 stair box
  const WELL  = [[-7.5,16.05],[-6.0,16.05],[-6.0,15.0],[-7.5,15.0]];          // 1.5 x 1 light well
  const ST12  = [[-24,-12],[14,-12],[14,0],[-24,0]];
  const ST6   = [[0,0],[3.46,13.67],[4.6,18.2],[10.6,19.7],[5.82,1.47],[14,0],[14,-12],[0,-12]];
  const NB_TOP= [[-9.58,16.97],[3.46,13.67],[4.6,18.2],[-8.4,21.7]];
  const NB_LEFT=[[-13.45,0],[-9.58,16.97],[-14.2,18.1],[-18.5,0]];

  const H1=3.75, H2=7.5, H3=10.5, H4=13.5, SLAB=0.25;

  // ---------- colours ----------
  const C = {
    land:0xD9D2C2, street:0x9A9AA0, nb:0xC8C2B4,
    s1:0xE07A5F, s2:0xF2C14E,
    slab:0xBFB8AC, wh:0xD9A441, apt:0x6F9BD6, core:0x2A8C8C, well:0xB9C7D6,
    wall:0x8E96A3, door:0x3A3F48, rail:0x556070, roof:0xA8A29A
  };

  // ---------- renderer / scene ----------
  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,0.1,400);
  const target=new THREE.Vector3(-6,5,-11);
  let sph={r:42,theta:0.55,phi:1.05};

  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8070,0.9));
  const sun=new THREE.DirectionalLight(0xffffff,0.75); sun.position.set(-20,40,25); scene.add(sun);

  function bgFromTheme(){
    const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#F1EFEA';
    scene.background=new THREE.Color(bg);
  }
  bgFromTheme();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',bgFromTheme); }catch(e){}
  new MutationObserver(bgFromTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // ---------- helpers ----------
  function shape(pts,hole){ const s=new THREE.Shape(); pts.forEach((p,i)=> i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath();
    if(hole){ const h=new THREE.Path(); hole.forEach((p,i)=> i?h.lineTo(p[0],p[1]):h.moveTo(p[0],p[1])); h.closePath(); s.holes.push(h); } return s; }
  function prism(pts,base,h,color,opacity,edges,hole){
    const g=new THREE.ExtrudeGeometry(shape(pts,hole),{depth:h,bevelEnabled:false});
    const m=new THREE.MeshLambertMaterial({color,transparent:opacity<1,opacity,depthWrite:opacity>=0.6});
    const mesh=new THREE.Mesh(g,m); mesh.rotation.x=-Math.PI/2; mesh.position.y=base;
    const grp=new THREE.Group(); grp.add(mesh);
    if(edges!==false){ const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x2b2f36,transparent:true,opacity:0.55})); e.rotation.x=-Math.PI/2; e.position.y=base; grp.add(e); }
    return grp;
  }
  function flat(pts,color,y,opacity){ return prism(pts,y||0,0.02,color,opacity||1,false); }
  function wall(x1,y1,x2,y2,base,h,color,opacity,t){
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
    const g=new THREE.BoxGeometry(L,h,t||0.15);
    const m=new THREE.MeshLambertMaterial({color,transparent:opacity<1,opacity:opacity==null?1:opacity});
    const mesh=new THREE.Mesh(g,m);
    mesh.position.set((x1+x2)/2,base+h/2,-(y1+y2)/2); mesh.rotation.y=Math.atan2(dy,dx);
    return mesh;
  }
  function ring(pts,base,h,color,opacity,t){ const g=new THREE.Group(); for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length]; g.add(wall(a[0],a[1],b[0],b[1],base,h,color,opacity,t));} return g; }
  function label(text,x,y,z,w){
    const cv=document.createElement('canvas'); cv.width=512; cv.height=128; const ctx=cv.getContext('2d');
    ctx.fillStyle='rgba(255,255,255,0.86)'; roundRect(ctx,8,14,496,100,22); ctx.fill();
    ctx.fillStyle='#22252B'; ctx.font='700 46px Cairo, Tajawal, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.direction='rtl';
    ctx.fillText(text,256,66);
    const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    const W=w||4.2; sp.scale.set(W,W/4,1); sp.position.set(x,y,-z); sp.renderOrder=10; return sp;
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ---------- levels (the "4D" steps) ----------
  const levels=[]; for(let i=0;i<7;i++){ const g=new THREE.Group(); const lab=new THREE.Group(); g.add(lab); g.userData.lab=lab; levels.push(g); scene.add(g); }
  const L=(i)=>levels[i];            // geometry of a step
  const LB=(i)=>levels[i].userData.lab; // words of a step (shown only while that step is active)

  // 0 · the whole land
  L(0).add(flat(ST12,C.street,-0.02)); L(0).add(flat(ST6,C.street,-0.02));
  L(0).add(flat(NB_TOP,C.nb,-0.01)); L(0).add(flat(NB_LEFT,C.nb,-0.01));
  L(0).add(flat(LAND,C.land,0));
  L(0).add(label('شارع ١٢ م',-6,0.6,-6,4)); L(0).add(label('شارع ٦ م',8,0.6,8,3.6));
  L(0).add(label('جار',-3,0.6,19,2.4)); L(0).add(label('جار',-16,0.6,9,2.4));
  LB(0).add(label('الأرض الكلية ٢٠٩ م²',-6,1.4,9,6));

  // 1 · the two set-back strips
  L(1).add(flat(STRIP1,C.s1,0.03)); L(1).add(flat(STRIP2,C.s2,0.03));
  LB(1).add(label('رجوع ٦ م — ٧٩ م²',-6,0.9,3,5)); LB(1).add(label('رجوع ٣ م — ٢٥ م²',1.6,0.9,10,5));
  LB(1).add(label('للبناء ١٠٥ م²',-6,0.9,11,4.5));
  L(1).add(flat(BLD,0x9DB9E0,0.04));

  // 2 · warehouse, lower half (0 → 3.75)
  L(2).add(prism(BLD,0,SLAB,C.slab,1));
  L(2).add(ring(BLD,SLAB,H1-SLAB,C.wh,0.33,0.25));
  L(2).add(wall(-8.6,5.84,-4.0,5.84,SLAB,4.5,C.door,1,0.12));            // big warehouse door
  LB(2).add(label('باب المخزن ٤.٥ × ٤.٥',-6.3,5.4,4.3,5));
  L(2).add(prism(CORE,SLAB,H1-SLAB,C.core,0.85));
  function column(x,y,base,h){ const m=new THREE.Mesh(new THREE.BoxGeometry(0.4,h,0.4),new THREE.MeshLambertMaterial({color:0x7A7F88})); m.position.set(x,base+h/2,-y); return m; }
  COLS.forEach(c=>L(2).add(column(c[0],c[1],SLAB,H1-SLAB)));
  LB(2).add(label('٩ عمدان ٤٠×٤٠',-6.9,H1+0.5,10.8,4.2));
  L(2).add(wall(0.33,13.54,0.04,12.38,SLAB,2.3,C.door,1,0.12));            // apartments' door on the 6 m street
  LB(2).add(label('مدخل الشقق',2.8,2.2,13.2,3.6));
  LB(2).add(label('سلم الشقق',-1.9,H1+0.6,13.7,3.2));
  LB(2).add(label('مخزن ≈ ٩٠ م²',-6.5,2.2,9,4.8));

  // 3 · mezzanine + upper warehouse walls (3.75 → 7.5)
  L(3).add(prism(MEZZ,H1,SLAB,C.slab,0.95,true,MEZZ_HOLE));
  L(3).add(wall(-10.99,10.8,-0.36,10.8,H1-0.6,0.6,C.slab,1,0.3));          // edge beam of the mezzanine
  L(3).add(ring(BLD,H1,H2-H1,C.wh,0.33,0.25));
  L(3).add(prism(CORE,H1,H2-H1,C.core,0.85));
  COLS.forEach(c=>L(3).add(column(c[0],c[1],H1,H2-H1)));
  (function(){ // warehouse stair: 22 steps under the mezzanine, along the left wall, coming out through the opening
    const mat=new THREE.MeshLambertMaterial({color:C.rail});
    for(let i=0;i<22;i++){ const st=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.17,0.27),mat); st.position.set(-9.9,SLAB+(i+0.5)*0.17,-(16.6-i*0.27-0.135)); L(2).add(st); }
    L(2).add(wall(-9.25,16.6,-9.25,10.9,SLAB,0.9,C.rail,0.5,0.06));       // hand-rail line
  })();
  LB(3).add(label('سلم المخزن تحت الميزانين',-9.9,H1+1.4,12.5,5));
  LB(3).add(label('ميزانين ≈ ٤٠ م²',-5,H1+1.2,14,4.6));
  LB(3).add(label('فراغ مفتوح ٧.٥ م',-6.5,5.6,7.5,4.8));

  // 4 / 5 · apartments
  function apartment(lv,base,name){
    const g=L(lv), lb=LB(lv);
    g.add(prism(BLD,base,SLAB,C.slab,1));
    g.add(ring(BLD,base+SLAB,3-SLAB,C.apt,0.30,0.25));
    g.add(prism(CORE,base,3,C.core,0.85));
    g.add(prism(WELL,base,3,C.well,0.35));
    const wh=2.75,b=base+SLAB;
    const W=[ [-11.35,9.2,-9.4,9.2],[-8.5,9.2,-6.4,9.2],[-5.5,9.2,-0.77,9.2],   // front band wall, 3 door gaps
              [-6.6,5.85,-6.6,9.2],                                            // bedroom 1 | bedroom 2
              [-5.0,9.2,-5.0,9.6],[-5.0,10.5,-5.0,12.75],                       // bedroom 3 | living
              [-10.62,12.4,-6.5,12.4],[-5.5,12.4,-5.0,12.4],                    // living | back band
              [-7.5,12.4,-7.5,12.6],[-7.5,13.5,-7.5,16.44],                     // kitchen | hall, bath, well
              [-7.5,13.6,-5.7,13.6],                                           // hall | bath
              [-7.5,15.0,-6.0,15.0],[-6.0,15.0,-6.0,16.07] ];                   // light well
    W.forEach(w=>g.add(wall(w[0],w[1],w[2],w[3],b,wh,C.wall,0.9,0.12)));
    g.add(wall(-4.92,13.0,-4.85,13.5,b,2.2,C.door,1,0.1));                      // flat door from the stair box
    // balconies on the 12 m street, 1.80 m projection
    [[-11.6,-7.0],[-6.2,-2.0]].forEach(([x1,x2])=>{
      g.add(prism([[x1,5.84],[x2,5.84],[x2,4.04],[x1,4.04]],base,0.15,C.slab,1));
      g.add(wall(x1,4.04,x2,4.04,base+0.15,1.0,C.rail,0.55,0.08));
      g.add(wall(x1,4.04,x1,5.84,base+0.15,1.0,C.rail,0.55,0.08));
      g.add(wall(x2,4.04,x2,5.84,base+0.15,1.0,C.rail,0.55,0.08));
    });
    lb.add(label(name,-6.5,base+3.6,8,5));
    lb.add(label('نوم ١ · ٥.٠ × ٣.٣',-9.2,base+1.4,7.5,3.4)); lb.add(label('نوم ٢ · ٥.٥ × ٣.٣',-3.9,base+1.4,7.5,3.4));
    lb.add(label('نوم ٣ · ٤.٨ × ٣.٤',-2.7,base+1.4,10.9,3.4)); lb.add(label('صالة · ٥.٩ × ٣.٢',-8.2,base+1.4,10.8,3.4));
    lb.add(label('مطبخ · ٢.٧ × ٤.٠',-9.0,base+1.4,14.3,3.2)); lb.add(label('حمام · ٢.٧ × ١.٥',-6.1,base+1.4,14.3,3.2));
    lb.add(label('هول',-6.2,base+1.4,13.0,1.6)); lb.add(label('منور ١ × ١.٥',-6.75,base+2.4,15.5,2.6));
    lb.add(label('سلم ٣ × ٥',-2.2,base+2.4,13.6,2.6));
    lb.add(label('بلكونة ٤.٦ × ١.٨',-9.3,base+1.0,4.6,3.2)); lb.add(label('بلكونة ٤.٢ × ١.٨',-4.1,base+1.0,4.6,3.2));
  }
  apartment(4,H2,'شقة الدور ٣ — ≈ ٨٨ م²');
  apartment(5,H3,'شقة الدور ٤ — ≈ ٨٨ م²');

  // 6 · roof + stair bulkhead
  L(6).add(prism(BLD,H4,SLAB,C.roof,1));
  L(6).add(prism(CORE,H4,2.6,C.core,0.85));
  L(6).add(prism(WELL,H4,0.3,C.well,0.5));
  LB(6).add(label('السطح + بيت السلم',-6,H4+1.6,10,5));

  // ---------- steps UI ----------
  const STEPS=[
    {c:'#D9D2C2',t:'الأرض الكلية',n:'<b>٢٠٩ م²</b> قبل أي رجوع. شارع الـ ١٢ تحت، وشارع الـ ٦ على اليمين، والجارين فوق وشمال.'},
    {c:'#E07A5F',t:'الرجوع للشارعين',n:'٦ متر لشارع الـ ١٢ (<b>٧٩ م²</b>) و ٣ متر لشارع الـ ٦ (<b>٢٥ م²</b>). الباقي للبناء <b>١٠٥ م²</b>، وده اللي كل الأدوار هتقف عليه.'},
    {c:'#D9A441',t:'المخزن: الدور الأول',n:'الباب الكبير ٤.٥ × ٤.٥ على شارع الـ ١٢. بيت سلم الشقق صندوق مقفول في الركن على شارع الـ ٦ (٣ × ٥) وليه بابه لوحده. ٩ عمدان ٤٠ × ٤٠ سم على شبكة حوالي ٤ إلى ٥ متر، شايلة الميزانين والشقتين. المخزن صافي <b>≈ ٩٠ م²</b>.'},
    {c:'#BFB8AC',t:'المخزن: الميزانين',n:'الدور التاني مش سقف كامل. سقف جزئي على النص الخلفي <b>≈ ٤٠ م²</b>. سلم المخزن ٢٢ درجة بعرض ١.٣٠ ماشي تحت الميزانين على حيطة الجار الشمال، وطالع من فتحة في السقف عند حرفه، فمبياخدش حاجة من الأرضية. النص اللي قدام الباب مفتوح بارتفاع <b>٧.٥ متر</b>.'},
    {c:'#6F9BD6',t:'شقة الدور الثالث',n:'<b>≈ ٨٨ م²</b> صافي. التلات أوض نوم كلهم على الشوارع وقريبين من بعض: نوم ١ ≈ ١٦.٥ · نوم ٢ ≈ ١٨ · نوم ٣ ≈ ١٦.٥ م². الصالة اتصغرت لـ ≈ ١٩ م² وبقت داخلية (من غير شباك). المطبخ والحمام في الضهر على منور ١ × ١.٥. بلكونتين بارزين ١.٨٠ على شارع الـ ١٢.'},
    {c:'#6F9BD6',t:'شقة الدور الرابع',n:'نفس توزيع الدور الثالث بالظبط، علشان الحمامات والمطابخ فوق بعض والمواسير تنزل في خط واحد.'},
    {c:'#A8A29A',t:'السطح',n:'سطح مكشوف + بيت السلم طالع عليه. الارتفاع الكلي حوالي <b>١٣.٥ متر</b> على الشارع.'}
  ];
  const stepsEl=document.getElementById('steps'), noteEl=document.getElementById('note');
  let cur=4, exploded=false, playing=false, timer=null;
  STEPS.forEach((s,i)=>{
    const b=document.createElement('button'); b.className='step'; b.type='button';
    b.innerHTML='<span class="sw" style="background:'+s.c+'"></span><span>'+s.t+'</span>';
    b.addEventListener('click',()=>{ stopPlay(); setStep(i); });
    stepsEl.appendChild(b);
  });
  function setStep(i){
    cur=i; [...stepsEl.children].forEach((b,k)=>{ if(k===i)b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
    noteEl.innerHTML='<b>'+STEPS[i].t+'</b><br>'+STEPS[i].n;
    levels.forEach((g,k)=>{ g.visible = k<=i; g.userData.lab.visible = (k===i); });
  }
  const playBtn=document.getElementById('play');
  function stopPlay(){ playing=false; clearInterval(timer); playBtn.setAttribute('aria-pressed','false'); playBtn.textContent='▶ اتفرج على البناء'; }
  playBtn.addEventListener('click',()=>{
    if(playing){ stopPlay(); return; }
    playing=true; playBtn.setAttribute('aria-pressed','true'); playBtn.textContent='⏸ وقّف';
    setStep(0); timer=setInterval(()=>{ if(cur>=6){ stopPlay(); return; } setStep(cur+1); },1700);
  });
  const exBtn=document.getElementById('explode');
  exBtn.addEventListener('click',()=>{ exploded=!exploded; exBtn.setAttribute('aria-pressed',String(exploded)); });
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.view;
    if(v==='street12') sph={r:42,theta:0.15,phi:1.15};
    if(v==='street6')  sph={r:42,theta:1.35,phi:1.1};
    if(v==='top')      sph={r:40,theta:0.3,phi:0.12};
  }));
  setStep(4);

  // ---------- orbit (drag / wheel / touch) ----------
  let drag=null, pinch=null;
  canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',e=>{ if(!drag||pinch)return; sph.theta-=(e.clientX-drag.x)*0.006; sph.phi=Math.min(1.5,Math.max(0.08,sph.phi-(e.clientY-drag.y)*0.006)); drag={x:e.clientX,y:e.clientY}; });
  canvas.addEventListener('pointerup',()=>drag=null); canvas.addEventListener('pointercancel',()=>drag=null);
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); sph.r=Math.min(110,Math.max(14,sph.r*(1+Math.sign(e.deltaY)*0.08))); },{passive:false});
  canvas.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); } },{passive:true});
  canvas.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); sph.r=Math.min(110,Math.max(14,sph.r*pinch/d)); pinch=d; e.preventDefault(); } },{passive:false});
  canvas.addEventListener('touchend',()=>{ pinch=null; });

  // ---------- loop ----------
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){ const w=canvas.clientWidth,h=canvas.clientHeight; if(canvas.width!==w||canvas.height!==h){ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); } }
  const stage=document.getElementById('stage'); new ResizeObserver(resize).observe(stage);
  function frame(){
    resize();
    // explode offsets, eased
    const gap=exploded?2.2:0;
    levels.forEach((g,k)=>{ const t=k>=3?(k-2)*gap:0; g.position.y+= (t-g.position.y)*(reduce?1:0.12); });
    if(!drag && !playing && !reduce) sph.theta+=0.0012;
    camera.position.set(target.x+sph.r*Math.sin(sph.phi)*Math.sin(sph.theta), target.y+sph.r*Math.cos(sph.phi), target.z+sph.r*Math.sin(sph.phi)*Math.cos(sph.theta));
    camera.lookAt(target);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>

</body>
</html>
