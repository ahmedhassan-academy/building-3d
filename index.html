<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>عمارة المخزن والشقتين — الترشيحات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
  :root{--bg:#EEF1F5;--panel:rgba(255,255,255,.92);--ink:#1D2026;--ink2:#5B6270;--line:#D5D9E0;--accent:#1F5FBF;--accent-ink:#fff;--chip:#E8ECF2}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal",system-ui,sans-serif;direction:rtl;-webkit-text-size-adjust:100%}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #top{position:fixed;top:0;right:0;left:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5;padding-top:calc(8px + env(safe-area-inset-top))}
  #top h1{font-size:15px;margin:0 6px 0 0;font-weight:700;white-space:nowrap}
  .pills{display:flex;gap:4px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;line-height:1.2}
  .pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  #side{position:fixed;right:10px;top:calc(var(--barh,60px) + 8px);width:290px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:4;font-size:13px;line-height:1.7}
  #side h2{font-size:14px;margin:0 0 4px}
  #side p{margin:0 0 6px;color:var(--ink2)}
  #side table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  #side td,#side th{border-bottom:1px solid var(--line);padding:2px 4px;text-align:right}
  #side td.n{text-align:left;white-space:nowrap}
  #side details summary{cursor:pointer;font-weight:600;color:var(--accent)}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .btn{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
  .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.big{font-weight:700;font-size:14px;padding:9px 8px}
  #hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));background:rgba(29,32,38,.82);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;z-index:4;text-align:center;line-height:1.5;max-width:92vw;pointer-events:none}
  #hud b{font-weight:700}
  #hud small{display:block;font-size:12px;opacity:.85}
  #cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid rgba(255,255,255,.85);border-radius:50%;z-index:3;pointer-events:none;display:none;mix-blend-mode:difference}
  #joy{position:fixed;left:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);z-index:4;display:none;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10;font-size:18px;font-weight:600}
  #hint{position:fixed;left:10px;top:calc(var(--barh,60px) + 8px);max-width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink2);z-index:4;line-height:1.6}
  #hint button{float:left;border:0;background:none;font-size:16px;cursor:pointer;color:var(--ink2);margin:-4px -4px 0 0}
  @media (max-width:760px){
    #top{gap:5px;padding:6px 8px}
    #top h1{font-size:13px;flex:1}
    #top .sep{display:none}
    .pills{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;padding-bottom:1px}
    .pills::-webkit-scrollbar{display:none}
    #props,#floors{width:100%}
    .pill{padding:4px 9px;font-size:12.5px;white-space:nowrap}
    #side{right:8px;left:8px;width:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));max-height:34vh;padding:8px 10px}
    #side.walk{display:none}
    #hint{top:calc(var(--barh,60px) + 8px);bottom:auto;left:8px;right:8px;max-width:none}
    #hud{bottom:calc(150px + env(safe-area-inset-bottom));font-size:13px}
  }
  #mobmenu{position:fixed;right:10px;bottom:calc(26px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:6px;z-index:4}
  #mobmenu .pill{background:rgba(255,255,255,.9)}
</style>
</head>

<canvas id="c"></canvas>

<div id="top">
  <h1>عمارة المخزن والشقتين</h1>
  <div class="pills" id="props"></div>
  <span class="sep"></span>
  <div class="pills">
    <button class="pill" id="mWalk" aria-pressed="false">🚶 امشي جوه</button>
    <button class="pill" id="mOrbit" aria-pressed="true">🔄 لف حواليها</button>
  </div>
  <span class="sep"></span>
  <div class="pills" id="floors"></div>
</div>

<aside id="side">
  <h2 id="ptitle"></h2>
  <p id="pdesc"></p>
  <div class="row" id="views">
    <button class="btn" data-v="s12">من شارع الـ ١٢</button>
    <button class="btn" data-v="s6">من شارع الـ ٦</button>
    <button class="btn" data-v="top">من فوق</button>
  </div>
  <div class="row">
    <button class="btn" id="tFurn" aria-pressed="true">الفرش</button>
    <button class="btn" id="tLab" aria-pressed="true">الأسماء والمقاسات</button>
    <button class="btn" id="tSun" aria-pressed="false">شمس العصر</button>
  </div>
  <details open><summary>مساحات الشقة</summary><table id="areas"></table></details>
  <p style="margin-top:6px;font-size:12px">الطوابق: مخزن ٣.٧٥ م × ٢ · شقق ٣.٠٠ م × ٢ · كل المقاسات من الرسم الـ 2D نفسه.</p>
</aside>

<div id="hint"><button id="hintX" aria-label="إخفاء">✕</button><span id="hintT">اسحب علشان تلف · عجلة الماوس أو أصبعين للتقريب · اختار ترشيح فوق.</span></div>
<div id="hud" hidden></div>
<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<div id="mobmenu">
  <button class="pill" id="mobExit">🔄 اخرج</button>
</div>

  kit: tex(512,(g,s)=>{ g.fillStyle='#CDC5B6'; g.fillRect(0,0,s,s); g.strokeStyle='#A89E8E'; g.lineWidth=3; for(let i=0;i<=2;i++){ g.beginPath(); g.moveTo(i*s/2,0); g.lineTo(i*s/2,s); g.moveTo(0,i*s/2); g.lineTo(s,i*s/2); g.stroke(); } noise(g,s,0,0.05,2000); },1.0),

  plaster: tex(256,(g,s)=>{ g.fillStyle='#F3F1EC'; g.fillRect(0,0,s,s); noise(g,s,0,0.05,1500); },2.0),
  facade: tex(512,(g,s)=>{ g.fillStyle='#D8CDB8'; g.fillRect(0,0,s,s); noise(g,s,0,0.08,5000); },2.0),
  facadeWH: tex(512,(g,s)=>{ g.fillStyle='#BFBDB6'; g.fillRect(0,0,s,s); noise(g,s,0,0.10,6000); },2.0),

  nb: tex(512,(g,s)=>{ g.fillStyle='#CFC3AE'; g.fillRect(0,0,s,s); noise(g,s,0,0.06,2000); g.fillStyle='#2E3A48'; g.fillRect(s*0.3,s*0.28,s*0.4,s*0.45); g.fillStyle='rgba(255,255,255,.18)'; g.fillRect(s*0.3,s*0.28,s*0.4,s*0.1); g.fillStyle='#8E8577'; g.fillRect(s*0.27,s*0.72,s*0.46,s*0.03); },3.2),

};
const std=(o)=>new THREE.MeshStandardMaterial(o);
const M={
  tile: std({map:T.tile,roughness:0.35,metalness:0}),
  bath: std({map:T.bath,roughness:0.25}),
  kit: std({map:T.kit,roughness:0.4}),

// ---------------- geometry helpers (plan x,y -> world x,-y) ----------------
const W=(x,y)=>new THREE.Vector3(x,0,-y);
function uvMetres(geo,L,H,Tt){ // BoxGeometry faces: +x,-x,+y,-y,+z,-z (4 verts each)
  const uv=geo.attributes.uv; const dims=[[Tt,H],[Tt,H],[L,Tt],[L,Tt],[L,H],[L,H]];
  for(let f=0;f<6;f++){ for(let v=0;v<4;v++){ const i=f*4+v; uv.setXY(i,uv.getX(i)*dims[f][0],uv.getY(i)*dims[f][1]); } }
  uv.needsUpdate=true;
}
function box(L,H,Tt,mat,cx,cz,cy,rotY=0,opts={}){
  const g=new THREE.BoxGeometry(L,H,Tt); uvMetres(g,L,H,Tt);
  const m=new THREE.Mesh(g,mat); m.position.set(cx,cy,cz); m.rotation.y=rotY;
  m.castShadow=opts.cast!==false; m.receiveShadow=true; return m;
}
function shape(pts,holes){ const s=new THREE.Shape(); pts.forEach((p,i)=> i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath();

function prism(pts,base,h,mat,holes,opts={}){
  const g=new THREE.ExtrudeGeometry(shape(pts,holes),{depth:h,bevelEnabled:false});
  const m=new THREE.Mesh(g,mat); m.rotation.x=-Math.PI/2; m.position.y=base; m.castShadow=opts.cast!==false; m.receiveShadow=true; return m;
}
function slabMesh(pts,top,holes,matTop,matBottom){ // slab with a ceiling material underneath
  const g=new THREE.ExtrudeGeometry(shape(pts,holes),{depth:SLAB,bevelEnabled:false});
  const m=new THREE.Mesh(g,[matTop,matBottom||M.ceiling]);
  // groups: 0 = caps (top+bottom), 1 = sides. give the bottom cap the ceiling material by splitting the cap group
  // ExtrudeGeometry cap group covers both caps; we recolor via a second mesh for the ceiling instead
  m.rotation.x=-Math.PI/2; m.position.y=top-SLAB; m.castShadow=true; m.receiveShadow=true;
  const g2=new THREE.ShapeGeometry(shape(pts,holes)); const c=new THREE.Mesh(g2,matBottom||M.ceiling);

  const grp=new THREE.Group(); grp.add(m,c); return grp;

function floorFinish(pts,z,mat,holes){ const m=prism(pts,z,0.02,mat,holes,{cast:false}); return m; }
function inwardNormal(poly,i){

  if(!inside(m,poly)) n=[-n[0],-n[1]]; return n;

  if((yi>p[1])!==(yj>p[1]) && p[0]<(xj-xi)*(p[1]-yi)/(yj-yi)+xi) ins=!ins; } return ins; }

// collision + walkable registry
const COL=[]; window.__col=COL;    // {a:[x,y],b:[x,y],z0,z1,door?}

function innerRect(poly){ // largest-ish axis rectangle inside the polygon (shrink the bbox until its corners are inside)
  let x0=Math.min(...poly.map(p=>p[0])),x1=Math.max(...poly.map(p=>p[0])),y0=Math.min(...poly.map(p=>p[1])),y1=Math.max(...poly.map(p=>p[1]));

  let n=0; while(!ok()&&n<40){ n++; const cs=[[x0+0.06,y0+0.06],[x1-0.06,y0+0.06],[x1-0.06,y1-0.06],[x0+0.06,y1-0.06]];
    if(!inside(cs[1],poly)||!inside(cs[2],poly)) x1-=0.1; else if(!inside(cs[0],poly)||!inside(cs[3],poly)) x0+=0.1; if(!inside(cs[2],poly)&&!inside(cs[3],poly)) y1-=0.1; }

    let mx=0,my=0; if(keys.KeyW||keys.ArrowUp) my+=1; if(keys.KeyS||keys.ArrowDown) my-=1; if(keys.KeyA||keys.ArrowLeft) mx-=1; if(keys.KeyD||keys.ArrowRight) mx+=1;
    mx+=joyV[0]; my-=joyV[1]; const len=Math.hypot(mx,my); if(len>1){mx/=len;my/=len;}
    const sp=(keys.ShiftLeft||keys.ShiftRight)?2.6:1.5;
    player.x+=(fwd[0]*my+rgt[0]*mx)*sp*dt; player.y+=(fwd[1]*my+rgt[1]*mx)*sp*dt;
    collide();
    const zt=surfaceZ(); player.z+=(zt-player.z)*Math.min(1,dt*10);
    const wantFov=VW<VH?72:58; if(camera.fov!==wantFov){ camera.fov=wantFov; camera.updateProjectionMatrix(); }
    camera.position.set(player.x,player.z+player.eye,-player.y);
    const cp=Math.cos(player.pitch); camera.lookAt(player.x+Math.sin(player.yaw)*cp, player.z+player.eye+Math.sin(player.pitch), -(player.y+Math.cos(player.yaw)*cp));
    if(frameN%8===0){ updateHUD(); const lv=lvOf(player.z+0.2); bld.traverse(o=>{ if(o.userData.light) o.visible=(o.userData.lv===lv); }); }
  } else { orbit.update(); }
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
selectProp(1); setView('s12'); setMode('orbit');
requestAnimationFrame(()=>{ document.getElementById('load').remove(); frame(); });
</script>
